[workspace]
resolver = "3"
members = ["crates/appnux-core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/MinduLabs/Appnux"
license = "GPL-3.0-or-later"
authors = ["Appnux contributors"]

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_6"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_1"] }
appnux-core = { path = "crates/appnux-core" }
base64 = "0.22"
rayon = "1"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
