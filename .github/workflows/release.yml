# Push a tag like v0.2.0 to publish a release: builds the .deb and the AppImage on the oldest
# supported base, then creates the GitHub Release with both files attached.
# The tag must match `version` in Cargo.toml.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # No FUSE in a container: AppImages (linuxdeploy and its plugins) unpack and run instead.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Set up the build environment
        run: packaging/ci-setup.sh
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Test
        run: cargo test --workspace --release
      - name: Build .deb
        run: packaging/build-deb.sh
      - name: Fetch linuxdeploy
        run: packaging/fetch-linuxdeploy.sh
      - name: Build AppImage
        run: |
          # appimagetool downloads its runtime from GitHub, which sometimes answers 5xx.
          for attempt in 1 2 3; do
            packaging/build-appimage.sh && break
            [ "$attempt" = 3 ] && exit 1
            echo "retrying AppImage ($attempt)"; sleep 15
          done
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Publish the release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "Appnux ${TAG#v}" --generate-notes
          fi
