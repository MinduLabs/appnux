# Checks every push and pull request: formatting, lints, tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The oldest base Appnux supports (GTK 4.6, libadwaita 1.1): code that builds here builds
    # on every newer distro.
    container: ubuntu:22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up the build environment
        run: packaging/ci-setup.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
